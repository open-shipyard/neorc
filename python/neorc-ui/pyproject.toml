[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "neorc-ui"
dynamic = ["version"]
description = "The built web UI of the neorc manager: static assets, no code to run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "The neorc Authors" }]
maintainers = [{ name = "Luis Castro", email = "dev@guish.in" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# None: this distribution is the assets and the function that says where they are.
dependencies = []

[project.urls]
Homepage = "https://github.com/open-shipyard/neorc"
Issues = "https://github.com/open-shipyard/neorc/issues"
Changelog = "https://github.com/open-shipyard/neorc/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

# The built assets are gitignored, so they must be named as artifacts to be
# packaged; in the sdist too, so a wheel built from it needs no Node.js.
[tool.hatch.build]
artifacts = ["src/neorc_ui/static/**"]

# Builds ts/neorc-ui when the assets are missing. See hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/neorc_ui"]
