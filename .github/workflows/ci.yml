name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Each distribution ships its own copy of the license files, so they must
      # stay identical to the ones at the root of the repository.
      - name: Check license files are in sync
        run: |
          for dir in python/*/; do
            for file in LICENSE NOTICE AUTHORS; do
              diff -q "$file" "$dir$file"
            done
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The browser test needs the built UI and Chromium: once is enough.
          - python-version: "3.12"
            browser: true
    services:
      # The Postgres tests run against this rather than the embedded server, so
      # they also run on the Pythons pgserver has no wheels for.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: neorc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - if: matrix.browser
        uses: actions/setup-node@v7
        with:
          node-version-file: ts/neorc-ui/.nvmrc
          cache: npm
          cache-dependency-path: ts/neorc-ui/package-lock.json
      - if: matrix.browser
        name: Build the UI and fetch a browser, for the browser test
        run: |
          (cd ts/neorc-ui && npm ci && npm run build)
          uv run playwright install --with-deps chromium
      - run: uv run pytest
        env:
          NEORC_TEST_DATABASE_URL: postgresql://postgres:neorc@127.0.0.1:5432/postgres

  # The web UI, under ts/neorc-ui. Its dependency rules are in
  # contributing/js-dependencies.md; the checks here are the ones it names.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/neorc-ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ts/neorc-ui/.nvmrc
          cache: npm
          cache-dependency-path: ts/neorc-ui/package-lock.json
      - run: npm ci
      # Advisories for everything installed; signatures and provenance for
      # what ships in the bundle. The registry does not serve attestations for
      # every dev-only package, and a 404 there is not a reason to fail.
      - name: Known advisories, and registry signatures and provenance
        run: |
          npm audit
          npm audit signatures --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The bundled-package list is committed as the build wrote it
        run: git diff --exit-code -- bundled-packages.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      # Building neorc-ui builds the web UI, which needs Node.js.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ts/neorc-ui/.nvmrc
          cache: npm
          cache-dependency-path: ts/neorc-ui/package-lock.json
      - run: uv build --all-packages
