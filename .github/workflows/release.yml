name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [neorc-core, neorc]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives every package's version from the git tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
      - run: uv build --package ${{ matrix.package }} --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # PyPI Trusted Publishing mints one token per project, so each package is
      # uploaded on its own. Serialized so neorc-core lands before neorc, which
      # depends on it.
      max-parallel: 1
      matrix:
        package: [neorc-core, neorc]
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
