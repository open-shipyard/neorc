# Workspace root. It ships no code of its own; the distributions live in
# python/<name>. See CONTRIBUTING.md for the layout.

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
neorc = { workspace = true }
neorc-core = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2",
    "neorc[http,manager,postgres]",
    "neorc-core",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    # A real Postgres for the tests, with no Docker and no system install.
    # Wheels stop at 3.12; on newer Pythons point NEORC_TEST_DATABASE_URL at a
    # server instead, as CI does, or those tests skip.
    "pgserver>=0.1.4; sys_platform != 'win32' and python_version < '3.13'",
    # Browser tests for the web UI. The browser itself is a separate download,
    # see contributing/dev-environment.md; without it those tests skip.
    "playwright>=1.50",
    "pytest-playwright>=0.7",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 88
# The packages need 3.11; this root has no [project] for ruff to read it from.
target-version = "py311"
# Every package keeps its importable code in python/<name>/src, so isort can
# tell first-party imports from third-party ones.
src = ["python/*/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["conftest.py", "python/*/src", "python/*/tests"]

[tool.pytest.ini_options]
testpaths = ["python/neorc-core/tests", "python/neorc/tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
markers = ["postgres: needs a Postgres server; skipped when none can be reached"]
xfail_strict = true
